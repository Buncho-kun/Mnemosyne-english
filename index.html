<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="icon" type="image/png" href="icon-64.png"><link rel="apple-touch-icon" href="icon-180.png">
<title>Mnemosyne（ムネモシュネ）</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--card:#ffffff;--ink:#16181c;--ink2:#454a54;--sub:#727985;--line:#e2e4e8;--acc:#1e5a48;--acc-ink:#ffffff;--soft:#eaf2ee;--warn:#c23a2b;--warn-soft:#fbecea;--mid:#8a6a1f;--mid-soft:#f6f0e1;--serif:"Cormorant Garamond","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;--mincho:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif}
@media(prefers-color-scheme:dark){:root{--bg:#111316;--card:#111316;--ink:#ecedef;--ink2:#bcc1ca;--sub:#8d939e;--line:#2b2e35;--acc:#7fc7ad;--acc-ink:#0d1f19;--soft:#18241f;--warn:#f08377;--warn-soft:#2a1614;--mid:#d2b36a;--mid-soft:#262113}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif}
#app{max-width:560px;margin:0 auto;padding:0 16px 48px;min-height:100vh}
header{display:flex;align-items:center;gap:8px;padding:14px 0 10px;position:sticky;top:0;background:var(--bg);z-index:2}
header h1{flex:1;font-size:17px;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .hb{min-width:64px;background:none;border:0;color:var(--acc);font:inherit;font-size:15px;padding:8px 0;cursor:pointer}
header .hb.r{text-align:right}header .hb.l{text-align:left}
button{font:inherit;color:inherit;cursor:pointer}
.en{font-family:Georgia,"Times New Roman",serif}
.hero{background:var(--acc);color:var(--acc-ink);border-radius:18px;padding:20px;margin:6px 0 22px}
.hero .big{font-size:40px;font-weight:700;line-height:1.1}
.hero .lbl{font-size:13px;opacity:.85}
.hero .row{display:flex;gap:24px;margin-top:12px;font-size:13px}
h2{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:.06em;margin:22px 4px 8px}
.deck{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.deck .t{font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.deck .s{font-size:13px;color:var(--sub)}
.badge{font-size:12px;font-weight:600;background:var(--mid-soft);color:var(--mid);border-radius:99px;padding:2px 9px;white-space:nowrap}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px;display:flex}
.bar i{display:block;height:100%;background:var(--acc)}.bar i.b2{background:var(--mid);opacity:.6}
.muted{color:var(--sub);font-size:13px}
.deck.off{opacity:.6;border-style:dashed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--sub)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 16px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 14px;font-size:14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.btn{display:block;width:100%;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:15px;font-weight:600;margin-bottom:10px;text-align:center}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn small{display:block;font-weight:400;font-size:12px;opacity:.85}
.btn:disabled{opacity:.45}
.prog{font-size:13px;color:var(--sub);text-align:center;margin:2px 0 10px}
.fc{width:100%;min-height:300px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px}
.fc .w{font-size:34px;line-height:1.25;word-break:break-word}
.fc .w.jp{font-size:22px;font-family:inherit;font-weight:600}
.fc .pos{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.fc .m{font-size:20px;font-weight:600}
.fc .x{font-size:14px;color:var(--sub)}
.fc .hint{font-size:13px;color:var(--sub);margin-top:14px}
.spk{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 14px;font-size:13px;margin:12px auto 0;display:block}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grade button{border-radius:14px;padding:14px 4px;font-weight:600;border:1px solid var(--line);background:var(--card)}
.grade .g0{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.grade .g1{background:var(--mid-soft);color:var(--mid);border-color:transparent}
.grade .g2{background:var(--soft);color:var(--acc);border-color:transparent}
.q{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;font-size:19px;line-height:1.7;margin-bottom:14px}
.ety{font-size:13.5px;color:var(--acc);background:var(--soft);border-radius:10px;padding:6px 12px;line-height:1.5;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif}
.ety b{font-weight:700}
.fam{text-align:left;width:100%;font-size:14px;line-height:1.7;margin-top:6px}
.fam div{border-top:1px solid var(--line);padding:5px 2px}
.ans{min-height:64px;background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;margin-bottom:12px}
.ans.ok{border:2px solid var(--acc);background:var(--soft)}.ans.ng{border:2px solid var(--warn);background:var(--warn-soft)}
.chunks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chunk{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;font-size:16px}
.chunk.used{visibility:hidden}
.ans .chunk{background:var(--bg)}
.ja{font-size:16px;font-weight:600;line-height:1.6;margin:0 2px 12px}
.tools{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}.tools .spk{margin:0}
.star.on{background:var(--mid-soft);color:var(--mid);border-color:var(--mid);font-weight:600}
button.stat{font:inherit;color:inherit;cursor:pointer}
.stl{font-size:11px;color:var(--mid);white-space:nowrap;align-self:center}
.seg .chip{flex:1;text-align:center;font-weight:600}
.hintbox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:10px;font-size:14px}.hintbox summary{cursor:pointer;color:var(--acc);font-weight:600}.hintbox div{margin-top:6px}
.lt{font-size:20px;font-weight:700;margin:4px 4px 2px}
.lesson{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:6px 16px 14px;margin-bottom:14px;line-height:1.75}
.lesson .lh{font-size:16.5px;margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--acc);color:var(--acc)}
.lesson .lp{margin:8px 0;font-size:15px}
.lesson u{text-decoration:none;border-bottom:2px solid var(--acc)}
.lesson .hl,.q .hl,.exp .hl{background:var(--mid-soft);border-radius:4px;padding:0 3px}
.lex{display:flex;gap:10px;margin:10px 0}.lex .no{flex:none;font-size:12px;color:var(--sub);min-width:38px;padding-top:3px}
.lex.main .en{font-weight:700}.lex .en{font-size:16px}
.lja{font-size:14.5px;color:var(--sub);cursor:pointer;border-radius:6px}.lja.hid u,.lja.hid b{border-color:transparent;color:transparent}
.lja.hid{color:transparent!important;background:var(--line);min-height:1.5em}
.lng{margin:2px 0 8px 48px;font-size:14.5px;color:var(--warn)}.lok{margin:2px 0 8px 48px;font-size:14.5px;color:var(--acc)}
.lpt{background:var(--mid-soft);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14.5px}
.ltab{border:1px solid var(--line);border-radius:12px;margin:12px 0;overflow:hidden}.ltab .cap{background:var(--soft);color:var(--acc);font-weight:700;font-size:14px;padding:6px 12px}
.ltab table{width:100%;border-collapse:collapse;font-size:14px}.ltab td{padding:6px 10px;border-top:1px solid var(--line);vertical-align:top}.ltab td.en{font-weight:600;width:40%}
.q u{text-decoration:none;border-bottom:2px solid var(--acc)}
.cats{display:flex;flex-direction:column;gap:10px;margin-bottom:16px}
.cat{display:grid;grid-template-columns:1fr auto;grid-template-areas:"t b" "s b" "r r";column-gap:12px;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px 12px;font:inherit;color:inherit;cursor:pointer;width:100%}
.cat .ci{grid-area:i;font-size:24px;line-height:1;text-align:center}.cat .ct{grid-area:t;font-weight:700;font-size:16px}.cat .cs{grid-area:s;font-size:12.5px;color:var(--sub);line-height:1.4}
.cat .cb{grid-area:b;white-space:nowrap}.cat .cn{font-size:12px;color:var(--sub)}.cat .bar{grid-area:r;margin-top:10px}
.psg{max-height:44vh;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:15.5px;line-height:1.75;margin-bottom:12px;-webkit-overflow-scrolling:touch}
.psg p{margin:0 0 12px}.psg p:last-child{margin:0}
.psg .pn{font:600 11px/1 -apple-system,sans-serif;color:var(--sub);margin-right:6px}
.psg mark{background:var(--mid-soft);color:inherit;border-bottom:2px solid var(--mid);padding:0 1px}
.rq{font-size:16.5px;line-height:1.6;margin:0 2px 10px;font-weight:600}
.q .bl{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);text-align:center}
.q.c{text-align:center;font-size:30px}
.q u{text-decoration:none;border-bottom:2px solid var(--ink);padding:0 2px;cursor:pointer}
.q u sub{font:600 11px/1 -apple-system,sans-serif;color:var(--sub);margin-left:2px}
.q u.ok{background:var(--soft);border-color:var(--acc)}.q u.ng{background:var(--warn-soft);border-color:var(--warn)}
.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:8px}
.opt.ok{background:var(--soft);border-color:var(--acc);font-weight:600}
.opt.ng{background:var(--warn-soft);border-color:var(--warn)}
.abcd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.abcd .opt{text-align:center;font-weight:600}
.exp{background:var(--soft);border-radius:14px;padding:14px 16px;margin:12px 0;font-size:15px}
.exp b{color:var(--acc)}.exp.ng b{color:var(--warn)}.exp.ng{background:var(--warn-soft)}
.res{text-align:center;padding:26px 0 10px}.res .big{font-size:52px;font-weight:700;line-height:1.1}
.search{width:100%;font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:10px}
.li{display:flex;gap:10px;align-items:baseline;padding:10px 4px;border-bottom:1px solid var(--line)}
.li .n{font-size:11px;color:var(--sub);width:26px;flex:none;text-align:right}
.li .w{font-weight:600;width:38%;flex:none;word-break:break-word}
.li .m{font-size:14px;flex:1}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--line);align-self:center}
.dot.l{background:var(--mid)}.dot.m{background:var(--acc)}
.foot{text-align:center;font-size:12px;color:var(--sub);margin-top:26px}
.review{margin-top:8px}.review .li .w{width:44%}

/* ---- Mnemosyne：Kairos・Thémis と共通の落ち着いたデザイン ---- */
body{line-height:1.75}
#app{max-width:720px}
header{padding:calc(8px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line);margin:0 -16px 6px;padding-left:16px;padding-right:16px}
header h1{font-size:16px;font-weight:700}
header .hb{color:var(--ink2);font-size:14px}
.hero{background:none;color:var(--ink);border-radius:0;padding:26px 0 18px;margin:0}
.hero h1{font-family:var(--serif);font-size:40px;font-weight:600;letter-spacing:.02em;line-height:1.1;margin:0}
.hero .kana{font-family:var(--mincho);font-size:14px;color:var(--sub);margin-left:6px;letter-spacing:.1em}
.hero p{margin:8px 0 0;color:var(--ink2);font-size:14px;line-height:1.8}
.hero .hstat{margin-top:14px;font-size:13px;color:var(--sub)}
.hero .hstat b{color:var(--ink);font-size:17px;font-variant-numeric:tabular-nums;margin:0 2px}
.hero .hstat b.hot{color:var(--acc)}
h2{font-size:13px;color:var(--sub);font-weight:600;letter-spacing:0;margin:26px 0 2px}
.cats{display:block;margin:0 0 18px;gap:0}
.cat{display:flex !important;align-items:center;gap:10px;background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:14px 0;min-height:0;grid-template:none}
.cat .ct{font-size:16px;font-weight:700;margin:0}.cat .cs{font-size:12.5px;color:var(--sub);margin:1px 0 0}
.cat .cmain{flex:1;min-width:0}.cat .cb{margin:0}.cat .bar{display:none}
.chev{flex:none;color:var(--sub);font-size:18px;line-height:1}
.deck{background:none;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:13px 0;margin:0}
.deck .t{font-size:15.5px}.deck .s{font-size:12.5px}
.bar{height:3px;margin-top:8px}
.badge{border-radius:6px;padding:1px 8px;font-size:11.5px}
.btn{border-radius:8px;padding:13px;margin-bottom:8px}
.stat{border-radius:8px}
.chip{border-radius:7px;padding:6px 13px;font-size:13.5px}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.fc{border-radius:12px;min-height:280px}
.q{border-radius:10px}
.lesson{border-radius:10px;border-left:0;border-right:0;border-radius:0;padding-left:0;padding-right:0;border-top:0;border-bottom:0}
.lesson .lh{color:var(--ink);border-bottom:1px solid var(--line);font-size:16px}
.lt{font-family:var(--mincho);font-size:21px}
.grade button{border-radius:8px}
.opt{border-radius:8px !important}
.exp{border-radius:8px !important}
.psg{border-radius:10px !important}
.hintbox{border-radius:8px}
.ltab{border-radius:8px}
.foot{text-align:center}
.rangesel{display:flex;align-items:center;gap:10px;margin:4px 0 16px;font-size:13px;color:var(--sub)}
.rangesel select{flex:1;font:inherit;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px}

/* ===== Mnemosyne：Kairos・Thémis と同じ作り（色は深緑） ===== */
:root{--bg:#e8f1ea;--sheet:#fbfdfb;--card:#fbfdfb;--ink:#17201c;--ink2:#4a564f;--sub:#7b867f;--line:#d6e3d9;--press:#e1ece4;
  --acc:#1e5a48;--acc-ink:#fff;--soft:#dcebe2;--gold:#9a7a3f;--hdr:rgba(232,241,234,.86);--r:6px;--nav-h:56px;
  --glow:radial-gradient(120% 70% at 50% 30%,#f5faf6 0%,#e7f0e9 55%,#d5e5da 100%);
  --fbody:"BIZ UDPGothic","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#0b110f;--sheet:#16201c;--card:#16201c;--ink:#e8efea;--ink2:#b7c4bc;--sub:#7f8d85;--line:#26332d;--press:#1f2b26;
  --acc:#8fd0b6;--acc-ink:#0b1a14;--soft:#183027;--gold:#d9b783;--hdr:rgba(11,17,15,.84);
  --glow:radial-gradient(130% 70% at 50% 18%,#15382b 0%,#0e1d17 45%,#060a08 100%)}}
body{background:var(--bg);font-family:var(--fbody);font-size:15.5px;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom))}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--glow);pointer-events:none}
header{background:var(--hdr);-webkit-backdrop-filter:saturate(1.4) blur(12px);backdrop-filter:saturate(1.4) blur(12px);z-index:5}
.hero{padding:calc(30px + env(safe-area-inset-top)) 2px 14px}
.hero h1{font-size:42px;letter-spacing:.05em;font-weight:600}
.hero .kana{display:block;margin:4px 0 0;font-family:inherit;font-size:13px;letter-spacing:.06em;color:var(--sub)}
.hero .hstat{margin-top:12px}
h2{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ink2);margin:24px 4px 8px}
h2::before{content:"";flex:none;width:4px;height:13px;border-radius:1px;background:var(--acc)}
/* 一覧：白い面にまとめ、区切り線は内側から */
.cats,.grp{background:var(--sheet);border-radius:var(--r);overflow:hidden;margin:0 0 14px}
.cat,.deck{position:relative;padding:14px 16px;border-bottom:0;background:none;color:var(--ink)}
.cat+.cat::before,.deck+.deck::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.cat:active,.deck:active{background:var(--press)}
.deck .bar{background:var(--line)}
.badge{background:var(--soft);color:var(--acc)}
/* 面 */
.fc,.q,.opt,.psg,.lesson,.hintbox,.chunk,.ans,.stat,.grade button,.search,.rangesel select{background:var(--sheet)}
.fc,.q,.psg{border-color:transparent;border-radius:var(--r)}
.lesson{background:var(--sheet);border-radius:var(--r);padding:6px 16px 14px}
.exp{background:var(--sheet);position:relative;padding:14px 16px 14px 19px}
.exp::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 2px 2px 0;background:var(--acc)}
.exp.ng{background:var(--sheet)}.exp.ng::before{background:var(--warn)}
.opt{border-color:var(--line)}.opt:active{background:var(--press)}
/* ボタン */
.btn{background:var(--sheet);border-color:var(--line);font-weight:700}
.btn.p{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.ghost{font-weight:500}
.chip{background:var(--sheet);border-color:var(--line);border-radius:999px}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.seg{background:var(--press);border-radius:9px;padding:2px;gap:2px}
.seg .chip{border:0;border-radius:7px;background:none;color:var(--sub)}
.seg .chip.on{background:var(--sheet);color:var(--ink);box-shadow:0 1px 3px rgba(20,30,25,.14)}
/* 下部のタブ */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnav .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
.bnav button{border:0;background:none;display:grid;place-items:center;align-content:center;gap:3px;padding:0;font:inherit;font-size:10.5px;color:var(--sub);cursor:pointer}
.bnav svg.i{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.bnav button[aria-current="page"]{color:var(--acc);font-weight:700}
.bnav button:active{background:var(--press)}
.h2r{margin-left:auto;font-weight:500;font-size:12px;color:var(--sub)}
.pday{margin:-2px 4px 8px;font-size:13px;color:var(--sub)}.pday b{color:var(--ink);font-size:16px;font-variant-numeric:tabular-nums;margin:0 2px}.pday b.hot{color:var(--acc)}
.pleft{font-size:13px;color:var(--sub);font-weight:500;white-space:nowrap}.pleft b{color:var(--acc);font-size:16px;font-variant-numeric:tabular-nums}
.pdone{font-size:12.5px;color:var(--acc);font-weight:600;white-space:nowrap}
.ptext{background:var(--sheet);border-radius:var(--r);padding:12px 16px;margin:14px 0 4px;font-size:14px;line-height:1.85;color:var(--ink2)}.ptext p{margin:6px 0}.ptext b{color:var(--ink)}
div.deck{cursor:default}
.pp{font-size:11.5px;color:var(--sub);font-weight:500;margin-left:6px}
.fc .w.sent{font-size:19px;line-height:1.6;font-family:inherit}.fc .w.jp.sent{font-size:17px}
.rei{margin:0 0 8px}.lock{font-size:12.5px;color:var(--sub);margin:-2px 4px 10px}
.lis{background:var(--sheet);border-radius:var(--r);padding:18px 16px 12px;margin-bottom:12px;text-align:center}
.lplay{border:0;background:var(--acc);color:var(--acc-ink);font:inherit;font-weight:700;font-size:16px;border-radius:999px;padding:12px 26px;cursor:pointer}
.lis .rate{margin:12px 0 0;display:flex}.lis .rate .chip{font-size:12.5px;padding:6px 4px}
.rnote{font-size:11.5px;color:var(--sub);margin:8px 0 0}.linkb{border:0;background:none;color:var(--acc);font:inherit;padding:0;text-decoration:underline;cursor:pointer}
.row2{display:flex;gap:8px}.row2 .btn{flex:1}
.dres{font-size:17px;line-height:1.9}.dok{color:var(--acc)}.dx{color:var(--warn);text-decoration:line-through}.dm{color:var(--warn);border-bottom:2px solid var(--warn)}
.chat{display:flex;flex-direction:column;gap:8px;margin:6px 0 12px}
.msg{max-width:86%;border-radius:12px;padding:10px 13px;font-size:15.5px;line-height:1.6}
.msg.ai{background:var(--sheet);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--acc);color:var(--acc-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg .mt{display:flex;gap:14px;margin-top:4px;font-size:12.5px}
.spq{font-size:20px;text-align:center}.spja{font-size:13.5px;color:var(--sub);margin-top:8px;font-family:var(--fbody)}
.mchart{display:flex;align-items:flex-end;gap:6px;height:150px;background:var(--sheet);border-radius:var(--r);padding:14px 12px 8px;margin-bottom:12px}
.mchart .mb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:10.5px;color:var(--sub)}

header{position:sticky;top:0}
header .hic{display:flex;justify-content:flex-end;gap:2px;min-width:64px}

.ib svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.ib.on{color:var(--acc)}.ib.sm{font-size:12px;padding:2px 8px;color:var(--acc)}
header.hhome{}
header.hhome .hlogo{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--ink);opacity:0;transition:opacity .2s;white-space:nowrap}
html.scrolled header.hhome .hlogo{opacity:1}
html[data-view="home"] .hero{padding-top:22px}
.badge.lec{background:var(--acc);color:var(--acc-ink)}
.h2l{border:0;background:none;color:var(--acc);font:inherit;font-size:12.5px;font-weight:600;padding:0 0 0 10px;cursor:pointer;white-space:nowrap}
.quick{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sheet);border-radius:var(--r);margin:0 0 6px;overflow:hidden}
.quick button{border:0;background:none;border-left:1px solid var(--line);padding:11px 2px 9px;color:var(--ink);cursor:pointer;line-height:1.35;font:inherit}
.quick button:first-child{border-left:0}.quick button:active{background:var(--press)}
.quick b{display:block;font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}.quick span{font-size:11px;color:var(--sub)}
.quick button.hot b{color:var(--acc)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.tile{border:0;background:var(--sheet);border-radius:var(--r);padding:13px 14px;text-align:left;color:var(--ink);cursor:pointer;font:inherit}
.tile:active{background:var(--press)}.tile b{display:block;font-size:14.5px}.tile span{font-size:12px;color:var(--sub)}

.pgrp .prow{padding:11px 16px}.pgrp .prow .bar{display:none}
.pgrp .prow .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}
.pgrp .prow .t span:first-child{font-size:15px}
.ctabs{display:flex}.ctabs .chip{flex:1;padding:6px 2px;font-size:13px}
.wk{display:flex;gap:8px;align-items:flex-end;height:96px;width:100%;background:var(--sheet);border:0;border-radius:var(--r);padding:12px 14px 8px;margin-bottom:12px;cursor:pointer}
.wk .wd{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.wk .wd i{display:block;width:100%;max-width:22px;background:var(--line);border-radius:3px 3px 0 0}
.wk .wd.td i{background:var(--acc)}.wk .wd em{font-style:normal;font-size:11px;color:var(--sub);margin-top:4px}.wk .wd.td em{color:var(--acc);font-weight:700}
.daily .dw{font-family:var(--serif);font-size:21px;font-weight:600}.daily .dx2{margin-top:4px;font-size:13.5px;color:var(--ink2);cursor:pointer}
.pall{float:right;font-size:12px}.pbar{height:4px;background:var(--line);border-radius:2px;margin:0 4px 10px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--acc)}
/* 背景画像とロゴ */
:root{--bgimg:url(bg-light.jpg)}
.lg-d{display:none!important}
@media(prefers-color-scheme:dark){:root{--bgimg:url(bg-dark.jpg)}.lg-l{display:none!important}.lg-d{display:block!important}}
.hero.logo{display:flex;justify-content:center;padding:14px 0 10px!important}
.hero.logo img{width:180px;height:auto;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.18))}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bgimg) center/cover no-repeat,var(--bg);transition:opacity .55s ease}
#splash img{width:62vw;max-width:300px;height:auto;opacity:0;animation:sp-in .9s ease-out .15s forwards}
#splash.out{opacity:0;pointer-events:none}
@keyframes sp-in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){#splash img{animation:none;opacity:1}}
#app{zoom:var(--z,1)}
.chip small{margin-left:5px;font-size:10.5px;opacity:.75}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dayc{border:1px solid var(--line);background:var(--sheet);border-radius:8px;padding:6px 0;color:var(--ink);font:inherit;cursor:pointer;line-height:1.3}
.dayc b{display:block;font-size:12.5px}.dayc span{font-size:10.5px;color:var(--sub)}
.dayc.on{background:var(--warn);border-color:var(--warn);color:#fff}.dayc.on span{color:#fff}
.skiprow .t span:first-child{font-size:14px!important;color:var(--sub)}
.lex{position:relative}.lex .lsay{position:absolute;right:0;top:2px}
td.sayc{cursor:pointer}.ltab td.nw{white-space:nowrap}.lex>div{padding-right:22px}.sayi{font-size:10px;color:var(--acc)}
</style>
